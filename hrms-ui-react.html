<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HRMS Demo UI</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  .topbar { background: #1a73e8; color: #fff; padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
  .topbar button { background: rgba(255,255,255,.2); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .topbar button.active { background: #fff; color: #1a73e8; font-weight: bold; }
  .wrap { padding: 20px; max-width: 1100px; margin: auto; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .flex { display: flex; gap: 16px; flex-wrap: wrap; }
  .flex > div { flex: 1 1 200px; }
  label { font-size: 12px; color: #555; font-weight: bold; }
  input, select { padding: 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
  button.go { background: #1a73e8; color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
  th { background: #fafafa; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { flex: 1 1 180px; background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.1); border-left: 5px solid #999; }
  .stat.green { border-color: #34a853; } .stat.orange { border-color: #fb8c00; }
  .stat.red { border-color: #ea4335; } .stat.blue { border-color: #1a73e8; }
  .stat .v { font-size: 22px; font-weight: bold; } .stat .l { font-size: 12px; color: #555; } .stat .s { font-size: 11px; color: #888; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #fff; background: #777; }
  .pill.PRESENT { background: #34a853; } .pill.WFH { background: #1a73e8; } .pill.ON_DUTY { background: #9c27b0; }
  .pill.ABSENT { background: #ea4335; } .pill.LEAVE { background: #fb8c00; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #323232; color: #fff; padding: 12px 18px; border-radius: 6px; display: none; }
  #toast.err { background: #b71c1c; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script type="text/babel">
  const { useState, useEffect } = React;

  // Same machine as this page? use it, otherwise local API default.
  const API_BASE = (window.location.protocol.startsWith('http') && window.location.hostname)
    ? `http://${window.location.hostname}:8000` : 'http://localhost:8000';

  async function api(method, path, body) {
    try {
      const r = await fetch(API_BASE + path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(() => null);
      return { ok: r.ok, status: r.status, data };
    } catch (e) {
      return { ok: false, status: 0, data: String(e) };
    }
  }

  function showToast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = ok ? '' : 'err';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  function StatCard({ label, value, cls, sub }) {
    return (
      <div className={'stat ' + (cls || '')}>
        <div className="l">{label}</div>
        <div className="v">{value}</div>
        {sub ? <div className="s">{sub}</div> : null}
      </div>
    );
  }

  function StatusPill({ value, halfDay }) {
    return <span><span className={'pill ' + value}>{value}</span>{halfDay ? ' (half day)' : ''}</span>;
  }

  // ---- dashboard: today's summary + record table ----
  function Dashboard() {
    const [month, setMonth] = useState('');
    const today = new Date();
    const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const [day, setDay] = useState(iso);
    const [rows, setRows] = useState([]);

    function load() {
      if (!day) { showToast('Pick a date first', false); return; }
      api('GET', `/attendance?date_from=${day}&date_to=${day}&page=1&page_size=200`).then(r => {
        if (r.ok) setRows(r.data.items);
        else showToast('Could not load: ' + JSON.stringify(r.data), false);
      });
    }
    useEffect(load, []);

    const presentToday = rows.filter(a => ['PRESENT', 'WFH', 'ON_DUTY'].includes(a.status)).length;
    const leaveToday = rows.filter(a => a.status === 'LEAVE').length;
    const absentToday = rows.filter(a => a.status === 'ABSENT').length;
    const lateToday = rows.filter(a => (a.late_minutes || 0) > 0).length;

    return (
      <div>
        <div className="card">
          <h3>Dashboard</h3>
          <div className="flex">
            <div><label>Day</label><br /><input type="date" value={day} onChange={e => setDay(e.target.value)} /></div>
            <div><label>Month</label><br /><input type="month" value={month} onChange={e => setMonth(e.target.value)} /></div>
            <div><br /><button className="go" onClick={load}>Load</button></div>
          </div>
        </div>
        <div className="stats">
          <StatCard label="Present Today" value={presentToday} cls="green" sub="office + WFH + on duty" />
          <StatCard label="On Leave Today" value={leaveToday} cls="orange" sub="approved leave records" />
          <StatCard label="Absent Today" value={absentToday} cls="red" sub="marked absent records" />
          <StatCard label="Late Arrivals Today" value={lateToday} cls="blue" sub="punched in after grace time" />
        </div>
        <div className="card">
          <h3>Records ({day})</h3>
          <table>
            <thead><tr><th>Code</th><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Late</th><th>OT</th></tr></thead>
            <tbody>
              {rows.map(a => (
                <tr key={a.emp_code + a.date}>
                  <td>{a.emp_code}</td><td>{a.date}</td>
                  <td><StatusPill value={a.status} halfDay={a.half_day} /></td>
                  <td>{a.punch_in ? new Date(a.punch_in).toLocaleTimeString() : '-'}</td>
                  <td>{a.punch_out ? new Date(a.punch_out).toLocaleTimeString() : '-'}</td>
                  <td>{a.late_minutes || 0}</td><td>{a.overtime_minutes || 0}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // ---- employees: directory + add form ----
  function Employees({ employees, reload }) {
    const [q, setQ] = useState('');
    const [dept, setDept] = useState('');
    const [form, setForm] = useState({
      emp_code: '', name: '', email: '',
      department: '', shift_start: '', shift_end: '', joined_on: ''
    });
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const depts = [...new Set(employees.map(e => e.department))];
    const rows = employees.filter(e =>
      (!dept || e.department === dept) &&
      (!q || e.name.toLowerCase().includes(q.toLowerCase()) || e.emp_code.toLowerCase().includes(q.toLowerCase()))
    );

    async function submit() {
      const r = await api('POST', '/employees', form);
      if (r.ok) { showToast(form.emp_code + ' added successfully'); reload(); }
      else showToast('Could not add: ' + JSON.stringify(r.data), false);
    }

    return (
      <div>
        <div className="card">
          <h3>Add New Employee</h3>
          <div className="flex">
            <div><label>Code</label><br /><input value={form.emp_code} onChange={e => set('emp_code', e.target.value)} /></div>
            <div><label>Name</label><br /><input value={form.name} onChange={e => set('name', e.target.value)} /></div>
            <div><label>Email</label><br /><input value={form.email} onChange={e => set('email', e.target.value)} /></div>
            <div><label>Dept</label><br /><input value={form.department} onChange={e => set('department', e.target.value)} /></div>
            <div><label>Shift</label><br /><input value={form.shift_start} size="5" onChange={e => set('shift_start', e.target.value)} /> -
              <input value={form.shift_end} size="5" onChange={e => set('shift_end', e.target.value)} /></div>
            <div><label>Joining</label><br /><input type="date" value={form.joined_on} onChange={e => set('joined_on', e.target.value)} /></div>
          </div>
          <button className="go" onClick={submit}>Add Employee</button>
        </div>
        <div className="card">
          <h3>Directory ({rows.length})</h3>
          <input placeholder="Search by name / code" value={q} onChange={e => setQ(e.target.value)} />
          <select value={dept} onChange={e => setDept(e.target.value)}>
            <option value="">All departments</option>
            {depts.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <table>
            <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Dept</th><th>Shift</th><th>Joined</th></tr></thead>
            <tbody>
              {rows.map(e => (
                <tr key={e.emp_code}>
                  <td>{e.emp_code}</td><td>{e.name}</td><td>{e.email}</td><td>{e.department}</td>
                  <td>{e.shift_start} – {e.shift_end}</td>
                  <td>{e.joined_on}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // ---- attendance: punch in / punch out / correction + record list ----
  function Attendance({ employees }) {
    const [inEmp, setInEmp] = useState('');
    const [inStatus, setInStatus] = useState('PRESENT');
    const [outEmp, setOutEmp] = useState('');
    const [cEmp, setCEmp] = useState('');
    const [cDate, setCDate] = useState('');
    const [cStatus, setCStatus] = useState('');
    const [cBy, setCBy] = useState('');
    const [cReason, setCReason] = useState('');
    const [cInTime, setCInTime] = useState('');
    const [cOutTime, setCOutTime] = useState('');
    const [from, setFrom] = useState('');
    const [to, setTo] = useState('');
    const [rows, setRows] = useState([]);

    function list() {
      api('GET', `/attendance?date_from=${from}&date_to=${to}&page=1&page_size=50`).then(r => {
        if (r.ok) setRows(r.data.items);
      });
    }
    useEffect(list, []);

    const empOptions = employees.map(e => (
      <option key={e.emp_code} value={e.emp_code}>{e.emp_code} — {e.name}</option>
    ));

    async function punchIn() {
      const r = await api('POST', '/attendance/punch-in', { emp_code: inEmp, status: inStatus });
      showToast(r.ok ? `Punch-in ok (late ${r.data.late_minutes} min)` : 'Punch-in failed: ' + JSON.stringify(r.data), r.ok);
      list();
    }
    async function punchOut() {
      const r = await api('POST', '/attendance/punch-out', { emp_code: outEmp });
      showToast(r.ok ? `Punch-out ok (OT ${r.data.overtime_minutes} min)` : 'Punch-out failed: ' + JSON.stringify(r.data), r.ok);
      list();
    }
    async function correct() {
      const body = { regularized_by: cBy, reason: cReason };
      if (cStatus) body.status = cStatus;
      if (cInTime) body.punch_in = new Date(cInTime).getTime();
      if (cOutTime) body.punch_out = new Date(cOutTime).getTime();
      const r = await api('PATCH', `/attendance/${cEmp}/${cDate}`, body);
      showToast(r.ok ? 'Correction saved' : 'Correction failed: ' + JSON.stringify(r.data), r.ok);
      list();
    }

    return (
      <div>
        <div className="flex">
          <div className="card">
            <h3>Punch In</h3>
            <select style={{ width: '100%' }} value={inEmp} onChange={e => setInEmp(e.target.value)}>{empOptions}</select><br />
            <br />
            <select style={{ width: '100%' }} value={inStatus} onChange={e => setInStatus(e.target.value)}>
              <option value="PRESENT">Office (Present)</option>
              <option value="WFH">Home (WFH)</option>
              <option value="ON_DUTY">Field duty (On Duty)</option>
            </select><br /><br />
            <button className="go" onClick={punchIn}>Punch In Now</button>
          </div>
          <div className="card">
            <h3>Punch Out</h3>
            <select style={{ width: '100%' }} value={outEmp} onChange={e => setOutEmp(e.target.value)}>{empOptions}</select><br /><br />
            <button className="go" onClick={punchOut}>Punch Out Now</button>
          </div>
          <div className="card">
            <h3>Correction</h3>
            <select style={{ width: '100%' }} value={cEmp} onChange={e => setCEmp(e.target.value)}>{empOptions}</select><br />
            <br />
            <input type="date" style={{ width: '100%' }} value={cDate} onChange={e => setCDate(e.target.value)} /><br />
            <br />
            <select style={{ width: '100%' }} value={cStatus} onChange={e => setCStatus(e.target.value)}>
              <option value="">(keep unchanged)</option>
              <option value="PRESENT">PRESENT</option><option value="WFH">WFH</option>
              <option value="ON_DUTY">ON_DUTY</option><option value="LEAVE">LEAVE</option>
              <option value="ABSENT">ABSENT</option>
            </select><br /><br />
            <input type="datetime-local" style={{ width: '100%' }} value={cInTime} onChange={e => setCInTime(e.target.value)} /><br />
            <br />
            <input type="datetime-local" style={{ width: '100%' }} value={cOutTime} onChange={e => setCOutTime(e.target.value)} /><br />
            <br />
            <input style={{ width: '100%' }} value={cBy} onChange={e => setCBy(e.target.value)} placeholder="corrected by (e.g. hr.admin)" /><br />
            <br />
            <input style={{ width: '100%' }} value={cReason} onChange={e => setCReason(e.target.value)} placeholder="reason for correction" /><br /><br />
            <button className="go" onClick={correct}>Save Correction</button>
          </div>
        </div>
        <div className="card">
          <h3>Records</h3>
          <div className="flex">
            <div><input type="date" value={from} onChange={e => setFrom(e.target.value)} /></div>
            <div><input type="date" value={to} onChange={e => setTo(e.target.value)} /></div>
            <div><button className="go" onClick={list}>Load</button></div>
          </div>
          <br />
          <table>
            <thead><tr><th>Code</th><th>Date</th><th>Status</th><th>In</th><th>Out</th><th>Hours</th><th>Late</th><th>OT</th></tr></thead>
            <tbody>
              {rows.map(a => (
                <tr key={a.emp_code + a.date}>
                  <td>{a.emp_code}</td><td>{a.date}</td>
                  <td><StatusPill value={a.status} halfDay={a.half_day} /></td>
                  <td>{a.punch_in ? new Date(a.punch_in).toLocaleTimeString() : '-'}</td>
                  <td>{a.punch_out ? new Date(a.punch_out).toLocaleTimeString() : '-'}</td>
                  <td>{a.work_hours != null ? a.work_hours : '-'}</td>
                  <td>{a.late_minutes || 0}</td><td>{a.overtime_minutes || 0}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // ---- reports: monthly per employee + daily department trend ----
  function Reports({ employees }) {
    const [emp, setEmp] = useState('');
    const [month, setMonth] = useState('');
    const [rep, setRep] = useState(null);
    const [dept, setDept] = useState('');
    const [from, setFrom] = useState('');
    const [to, setTo] = useState('');
    const [trend, setTrend] = useState([]);

    function monthly() {
      api('GET', `/analytics/employees/${emp}/monthly?month=${month}`).then(r => {
        if (r.ok) setRep(r.data);
        else showToast('Report failed: ' + JSON.stringify(r.data), false);
      });
    }
    function deptSummary() {
      api('GET', `/analytics/departments/summary?date_from=${from}&date_to=${to}`).then(r => {
        if (r.ok) showToast(JSON.stringify(r.data));
        else showToast('Summary failed: ' + JSON.stringify(r.data), false);
      });
    }
    function loadTrend() {
      api('GET', `/analytics/departments/${dept}/trend?date_from=${from}&date_to=${to}`).then(r => {
        if (r.ok) setTrend(r.data.trend || r.data);
        else showToast('Trend failed: ' + JSON.stringify(r.data), false);
      });
    }

    return (
      <div>
        <div className="card">
          <h3>Monthly Report</h3>
          <div className="flex">
            <div><label>Employee</label><br />
              <select value={emp} onChange={e => setEmp(e.target.value)}>
                {employees.map(e => <option key={e.emp_code} value={e.emp_code}>{e.emp_code} — {e.name}</option>)}
              </select>
            </div>
            <div><label>Month</label><br /><input type="month" value={month} onChange={e => setMonth(e.target.value)} /></div>
            <div><br /><button className="go" onClick={monthly}>Show</button></div>
          </div>
          {rep ? (
            <div>
              <br />
              <div className="stats">
                <StatCard label="Present" value={`${rep.present_days} / ${rep.working_days}`} cls="green" />
                <StatCard label="Late" value={rep.total_late_minutes + ' min'} sub={'late on ' + rep.late_count + ' days'} cls="blue" />
                <StatCard label="Overtime" value={rep.total_overtime_minutes + ' min'} sub={'leave: ' + rep.leave_days + ' days'} cls="orange" />
              </div>
            </div>
          ) : null}
        </div>
        <div className="card">
          <h3>Department</h3>
          <div className="flex">
            <div><label>Dept</label><br />
              <select value={dept} onChange={e => setDept(e.target.value)}>
                <option>Engineering</option><option>Sales</option><option>Support</option>
              </select>
            </div>
            <div><label>From</label><br /><input type="date" value={from} onChange={e => setFrom(e.target.value)} /></div>
            <div><label>To</label><br /><input type="date" value={to} onChange={e => setTo(e.target.value)} /></div>
          </div>
          <br />
          <button className="go" onClick={deptSummary}>Department Summary</button>
          &nbsp;
          <button className="go" onClick={loadTrend}>Daily Trend</button>
          {trend && trend.length ? (
            <div><br />
              <table>
                <thead><tr><th>Date</th><th>Present</th><th>Absent</th><th>Leave</th></tr></thead>
                <tbody>
                  {trend.map(t => (
                    <tr key={t.date}><td>{t.date}</td><td>{t.present}</td><td>{t.absent}</td><td>{t.leave}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : null}
        </div>
      </div>
    );
  }

  // ---- app shell ----
  function App() {
    const [page, setPage] = useState('dash');
    const [employees, setEmployees] = useState([]);

    function reload() {
      api('GET', '/employees?page=1&page_size=200').then(r => {
        if (r.ok) setEmployees(r.data.items);
      });
    }
    useEffect(reload, []);

    return (
      <div>
        <div className="topbar">
          <b>HRMS Demo</b>
          <button className={page === 'dash' ? 'active' : ''} onClick={() => setPage('dash')}>Dashboard</button>
          <button className={page === 'emp' ? 'active' : ''} onClick={() => setPage('emp')}>Employees</button>
          <button className={page === 'att' ? 'active' : ''} onClick={() => setPage('att')}>Attendance</button>
          <button className={page === 'rep' ? 'active' : ''} onClick={() => setPage('rep')}>Reports</button>
        </div>
        <div className="wrap">
          {page === 'dash' ? <Dashboard /> : null}
          {page === 'emp' ? <Employees employees={employees} reload={reload} /> : null}
          {page === 'att' ? <Attendance employees={employees} /> : null}
          {page === 'rep' ? <Reports employees={employees} /> : null}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
